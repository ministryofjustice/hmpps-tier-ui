name: Security veracode policy scan
on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * 1" # Every Monday at 04:25 UTC
jobs:
  security-veracode-policy-check:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Project security veracode policy scan
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_veracode_policy_scan.yml@3aa5e961949ee57f5c5e538c9a3e345402120ef3 # v2.22.7
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit
