name: Security veracode policy scan
on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * 1" # Every Monday at 04:25 UTC
jobs:
  security-veracode-policy-check:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Project security veracode policy scan
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_veracode_policy_scan.yml@2f477d94de98edf4c481ff948624118c3fc93e5a # v2.23.0
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit
