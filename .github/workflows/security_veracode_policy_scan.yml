name: Security veracode policy scan
on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * 1" # Every Monday at 04:25 UTC
jobs:
  security-veracode-policy-check:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Project security veracode policy scan
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_veracode_policy_scan.yml@304442013204ed99de7752c66ab9dcb98defb25c # v2.23.4
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit
