name: Security veracode pipeline scan
on:
  workflow_dispatch:
  schedule:
    - cron: "6 4 * * MON-FRI" # Every weekday at 04:06 UTC
jobs:
  security-veracode-pipeline-scan:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Project security veracode pipeline scan
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_veracode_pipeline_scan.yml@2a7bb1a9bdaa0ebad11f03538dbcf396ba3b7779 # v2.19.0
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit
