name: Security veracode pipeline scan
on:
  workflow_dispatch:
  schedule:
    - cron: "6 4 * * MON-FRI" # Every weekday at 04:06 UTC
jobs:
  security-veracode-pipeline-scan:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Project security veracode pipeline scan
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_veracode_pipeline_scan.yml@3aa5e961949ee57f5c5e538c9a3e345402120ef3 # v2.22.7
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit
